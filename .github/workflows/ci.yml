name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh .githooks/pre-push

      - name: Run delivery automation tests
        run: bash scripts/tests/test_finish_task.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release executable
        run: cargo build --locked --release

      - name: Smoke-test release executable
        shell: bash
        run: bash scripts/smoke-release.sh

  advisory:
    name: advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  cross-platform:
    name: cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run bounded Windows install/removal writer-lock regression
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: bash
        run: cargo test --locked --bin thrn cli::install_tests::installation_and_removal_cannot_race_under_the_receipt_store_lock -- --exact --nocapture

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release executable
        run: cargo build --locked --release

      - name: Smoke-test release executable
        shell: bash
        run: bash scripts/smoke-release.sh
