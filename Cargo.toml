[package]
name = "thrn"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Local-first universal developer CLI"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "thrn"
path = "src/main.rs"
